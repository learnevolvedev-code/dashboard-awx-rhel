// ── helpers ───────────────────────────────────────────────
function PeriodBar({value,onChange}){return(<div className="period-bar">{PERIODS.map(p=>(<button key={p} className={`period-btn${value===p?' active':''}`} onClick={()=>onChange(p)}>{p.charAt(0).toUpperCase()+p.slice(1)}</button>))}</div>);}
function StatusBadge({status}){const m={successful:'badge-success',failed:'badge-danger',error:'badge-danger',canceled:'badge-warning',running:'badge-info'};return <span className={`badge ${m[status]||'badge-muted'}`}>{status}</span>;}
function RoleBadge({level}){const m={admin:'role-admin',developer:'role-developer',viewer:'role-viewer'};return <span className={`role-chip ${m[level]||'role-viewer'}`}>{level||'viewer'}</span>;}
function CatBadge({cat}){const c=CAT_COLORS[cat]||'#64748b';return <span className="cat-badge" style={{background:`${c}18`,color:c,border:`1px solid ${c}30`}}>{cat||'—'}</span>;}
function RoiBasis({basis}){return basis==='dynamic'?<span className="badge badge-dynamic">⚡ dynamic</span>:<span className="badge badge-fallback">⬦ fallback</span>;}
function KPI({label,value,sub,color,accent}){return(<div className={`kpi-card ${accent||''}`}><div className="kpi-label">{label}</div><div className="kpi-value" style={color?{color}:undefined}>{value??'—'}</div>{sub&&<div className="kpi-sub">{sub}</div>}</div>);}
function Spinner(){return <div className="center"><div className="spinner"/></div>;}
function ErrorBox({msg}){return <div className="error-box">⚠ {msg}</div>;}
function SuccessBar({rate}){const color=rate>=95?'var(--success)':rate>=85?'var(--warning)':'var(--danger)';return(<div style={{display:'flex',alignItems:'center',gap:8}}><div className="prog-bar" style={{flex:1}}><div className="prog-fill" style={{width:`${Math.min(rate,100)}%`,background:color}}/></div><span style={{color,fontWeight:500,fontSize:12,minWidth:38}}>{rate}%</span></div>);}
function HostBar({changed=0,ok=0,failed=0}){const t=changed+ok+failed||1;return(<div className="host-bar" style={{width:'100%'}}><div title={`Changed: ${changed}`} style={{width:`${changed/t*100}%`,background:'var(--accent)',minWidth:changed?2:0}}/><div title={`OK: ${ok}`} style={{width:`${ok/t*100}%`,background:'var(--success)',minWidth:ok?2:0}}/><div title={`Failed: ${failed}`} style={{width:`${failed/t*100}%`,background:'var(--danger)',minWidth:failed?2:0}}/></div>);}
function fmtDur(s){if(!s)return'—';if(s<60)return`${Math.round(s)}s`;if(s<3600)return`${Math.floor(s/60)}m ${Math.round(s%60)}s`;return`${Math.floor(s/3600)}h ${Math.round((s%3600)/60)}m`;}
function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtMoney(v){if(v==null)return'—';return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);}
function fmtNum(v){return v==null?'—':Number(v).toLocaleString();}
function TT({active,payload,label}){if(!active||!payload?.length)return null;return(<div className="custom-tooltip"><div className="tt-label">{label}</div>{payload.map((p,i)=>(<div key={i} className="tt-item" style={{color:p.color}}><span>{p.name}</span><b style={{color:'var(--text)'}}>{typeof p.value==='number'?p.value.toLocaleString():p.value}</b></div>))}</div>);}
function getUserOrgLevel(user,orgId){if(!user)return'none';if(user.is_superuser||user.portal_role==='admin')return'admin';const p=user.org_permissions?.find(x=>x.org_id===orgId);return p?p.portal_level:'none';}
function getPermittedOrgs(user,all){if(!user||!all)return[];if(user.is_superuser||user.portal_role==='admin')return all;const ids=new Set((user.org_permissions||[]).map(p=>p.org_id));return all.filter(o=>ids.has(o.org_id));}
function ExportBtn({href,label,primary}){if(MOCK)return <button className={`export-btn${primary?' primary-export':''}`} onClick={()=>alert('Export disabled in demo mode')}>⬇ {label}</button>;return <a className={`export-btn${primary?' primary-export':''}`} href={API+href} target="_blank" rel="noreferrer">⬇ {label}</a>;}

// ── Dynamic ROI Config Modal ──────────────────────────────
function DynamicROIModal({item,orgs,onClose}){
  const cats=['patching','deployment','compliance','backup','monitoring','security','provisioning','decommission','general'];
  const[f,setF]=useState(item||{org_id:'',job_template_id:'',template_name:'',minutes_per_changed_host:0,minutes_per_ok_host:1,minutes_per_failed_host:15,minutes_per_unreachable:10,manual_minutes_per_run:0,engineer_hourly_rate:75,category:'general',complexity:'medium',is_active:true,notes:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  // Live preview: estimate value for 100 runs, 20 hosts each, 60% change rate
  const previewHosts=100*20,previewChanged=Math.round(previewHosts*.6),previewOk=previewHosts-previewChanged;
  const previewMins=previewChanged*f.minutes_per_changed_host+previewOk*f.minutes_per_ok_host;
  const previewValue=fmtMoney(previewMins/60*f.engineer_hourly_rate);
  return(<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal">
      <div className="modal-title">{item?'Edit':'Add'} Dynamic ROI Configuration</div>
      <div className="info-box" style={{marginBottom:14}}>
        Set <b style={{color:'var(--text)'}}>per-host effort baselines</b>. The ROI engine multiplies these against actual <code>hosts_changed</code> and <code>hosts_ok</code> counts from each AWX job run automatically.
      </div>
      <div className="form-row">
        <div className="form-group"><label className="form-label">Organization</label>
          <select className="form-input" value={f.org_id} onChange={e=>set('org_id',e.target.value)}>
            <option value="">Select org…</option>{orgs.map(o=><option key={o.org_id} value={o.org_id}>{o.org_name}</option>)}
          </select>
        </div>
        <div className="form-group"><label className="form-label">AWX Template ID</label>
          <input className="form-input" type="number" value={f.job_template_id} onChange={e=>set('job_template_id',e.target.value)} placeholder="e.g. 42"/>
        </div>
      </div>
      <div className="form-group"><label className="form-label">Template Name</label>
        <input className="form-input" value={f.template_name} onChange={e=>set('template_name',e.target.value)} placeholder="Patch RHEL Servers"/>
      </div>
      <div style={{background:'var(--surface2)',borderRadius:8,padding:'12px 14px',marginBottom:14,border:'1px solid var(--border)'}}>
        <div style={{fontSize:11,fontWeight:500,color:'var(--accent)',marginBottom:10,textTransform:'uppercase',letterSpacing:'.06em'}}>⚡ Dynamic Per-Host Effort Baselines</div>
        <div className="form-row">
          <div className="form-group" style={{marginBottom:8}}>
            <label className="form-label" style={{color:'var(--accent)'}}>Minutes / Changed Host</label>
            <input className="form-input" type="number" step="0.5" value={f.minutes_per_changed_host} onChange={e=>set('minutes_per_changed_host',+e.target.value)} min="0"/>
            <div className="form-hint">e.g. Patching: apply+verify+sign-off per host = 8 min</div>
          </div>
          <div className="form-group" style={{marginBottom:8}}>
            <label className="form-label" style={{color:'var(--success)'}}>Minutes / OK Host</label>
            <input className="form-input" type="number" step="0.5" value={f.minutes_per_ok_host} onChange={e=>set('minutes_per_ok_host',+e.target.value)} min="0"/>
            <div className="form-hint">e.g. Quick compliance check per already-patched host = 1 min</div>
          </div>
        </div>
        <div className="form-row">
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label" style={{color:'var(--danger)'}}>Minutes / Failed Host</label>
            <input className="form-input" type="number" step="1" value={f.minutes_per_failed_host} onChange={e=>set('minutes_per_failed_host',+e.target.value)} min="0"/>
            <div className="form-hint">Investigate + fix + re-run per failed host</div>
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label" style={{color:'var(--warning)'}}>Minutes / Unreachable Host</label>
            <input className="form-input" type="number" step="1" value={f.minutes_per_unreachable} onChange={e=>set('minutes_per_unreachable',+e.target.value)} min="0"/>
            <div className="form-hint">SSH check + ticket creation per unreachable host</div>
          </div>
        </div>
      </div>
      <div className="form-row">
        <div className="form-group"><label className="form-label">Engineer Rate ($/hr)</label>
          <input className="form-input" type="number" value={f.engineer_hourly_rate} onChange={e=>set('engineer_hourly_rate',+e.target.value)} min="1"/>
        </div>
        <div className="form-group"><label className="form-label">Fallback (mins/run)</label>
          <input className="form-input" type="number" value={f.manual_minutes_per_run} onChange={e=>set('manual_minutes_per_run',+e.target.value)} min="0"/>
          <div className="form-hint">Used only when AWX provides no host counts (workflow jobs)</div>
        </div>
      </div>
      <div className="form-row">
        <div className="form-group"><label className="form-label">Category</label>
          <select className="form-input" value={f.category} onChange={e=>set('category',e.target.value)}>
            {cats.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div className="form-group"><label className="form-label">Complexity</label>
          <select className="form-input" value={f.complexity} onChange={e=>set('complexity',e.target.value)}>
            {['simple','medium','complex','critical'].map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>
      <div style={{background:'rgba(59,130,246,.06)',border:'1px solid rgba(59,130,246,.2)',borderRadius:8,padding:'10px 14px',fontSize:12,color:'var(--muted)',marginBottom:10}}>
        <b style={{color:'var(--text)'}}>Preview</b> — at 100 runs × 20 hosts/run × 60% change rate:<br/>
        ({previewChanged} changed × {f.minutes_per_changed_host}m) + ({previewOk} ok × {f.minutes_per_ok_host}m) = {previewMins} mins → <b style={{color:'var(--success)'}}>{previewValue}</b> cost avoided
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <input type="checkbox" id="act" checked={f.is_active} onChange={e=>set('is_active',e.target.checked)}/>
        <label htmlFor="act" style={{fontSize:13,cursor:'pointer'}}>Active (include in ROI calculations)</label>
      </div>
      <div className="btn-row">
        <button className="btn-ghost" onClick={onClose}>Cancel</button>
        <button className="btn-primary" onClick={onClose}>{item?'Update':'Create'} Config</button>
      </div>
    </div>
  </div>);
}

      <div className="card"><div className="section-title" style={{marginBottom:12}}>Teams</div><div className="table-wrap"><table><thead><tr><th>Team</th><th>Description</th><th>Members</th></tr></thead><tbody>{(rbac?.teams||[]).map(t=>(<tr key={t.id}><td><b>{t.name}</b></td><td style={{color:'var(--muted)'}}>{t.description}</td><td>{t.member_count}</td></tr>))}</tbody></table></div></div>
    </div>}
  </div>);
}

function SyncPage(){
  const{data,loading,error}=useApi(()=>MOCK?Promise.resolve([{entity:'jobs',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:8764},{entity:'organizations',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:4},{entity:'users',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:50},{entity:'job_templates',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:121}]):apiFetch('/sync'),[]);
  return(<div style={{display:'flex',flexDirection:'column',gap:14}}>
    <h2 className="page-title">Sync Status</h2>
    {loading?<Spinner/>:error?<ErrorBox msg={error}/>:(<div className="card"><div className="table-wrap"><table><thead><tr><th>Entity</th><th>Last Synced</th><th>Status</th><th>Records</th></tr></thead><tbody>{(data||[]).map(s=>(<tr key={s.entity}><td className="mono">{s.entity}</td><td style={{color:'var(--muted)',fontSize:12}}>{fmtDate(s.last_synced_at)}</td><td>{s.last_status==='ok'?<span className="badge badge-success">OK</span>:<span className="badge badge-danger">{s.last_status}</span>}</td><td>{fmtNum(s.records_synced||0)}</td></tr>))}</tbody></table></div></div>)}
  </div>);
}

};
const MOCK_OBJECTS=[
  {awx_id:101,object_type:'job_template',org_id:1,org_name:'Platform Engineering',name:'Deploy App',description:'Deploy application to K8s cluster',modified_at:'2024-11-22'},
  {awx_id:102,object_type:'job_template',org_id:1,org_name:'Platform Engineering',name:'Patch RHEL Servers',description:'Apply OS patches to all RHEL hosts',modified_at:'2024-11-20'},

  {awx_id:131,object_type:'inventory',org_id:1,org_name:'Platform Engineering',name:'Staging Hosts',description:'Staging environment (85 hosts)',modified_at:'2024-10-05'},
  {awx_id:132,object_type:'inventory',org_id:2,org_name:'Security Operations',name:'DMZ Hosts',description:'DMZ servers (60 hosts)',modified_at:'2024-11-10'},
  {awx_id:133,object_type:'inventory',org_id:3,org_name:'Data & ML',name:'Data Cluster',description:'Hadoop/Spark nodes (32 hosts)',modified_at:'2024-09-28'},
  {awx_id:140,object_type:'credential',org_id:1,org_name:'Platform Engineering',name:'SSH Deploy Key',description:'Production SSH key (RSA 4096)',modified_at:'2024-06-14'},
  {awx_id:141,object_type:'credential',org_id:1,org_name:'Platform Engineering',name:'Vault Token',description:'HashiCorp Vault AppRole',modified_at:'2024-07-20'},
  {awx_id:142,object_type:'credential',org_id:2,org_name:'Security Operations',name:'RHEL Ansible Service Account',description:'Service account for compliance scans',modified_at:'2024-08-05'},
  {awx_id:201,object_type:'job_template',org_id:2,org_name:'Security Operations',name:'CIS Compliance Scan',description:'Run CIS benchmark checks',modified_at:'2024-11-18'},

  {awx_id:301,object_type:'job_template',org_id:4,org_name:'DevOps Core',name:'Provision K8s Node',description:'Bootstrap new Kubernetes worker node',modified_at:'2024-11-08'},
  {awx_id:302,object_type:'workflow_job_template',org_id:4,org_name:'DevOps Core',name:'Cluster Upgrade Pipeline',description:'Rolling cluster upgrade workflow',modified_at:'2024-11-01'},
];
function ObjBadge({type}){const m=OBJ_TYPE_META[type]||{label:type,color:'#64748b',icon:'◻'};return <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:500,background:`${m.color}14`,color:m.color,border:`1px solid ${m.color}25`}}>{m.icon} {m.label}</span>;}

function ObjectsPage({orgs,user,onOrgClick}){
  const[orgFilter,setOrgFilter]=useState('all');
  const[typeFilter,setTypeFilter]=useState('all');
  const[search,setSearch]=useState('');
  const permitted=useMemo(()=>getPermittedOrgs(user,orgs),[user,orgs]);
  // In live mode: fetch /api/orgs/{id}/objects for each permitted org and merge
  const allObjs=useMemo(()=>{
    const permIds=new Set(permitted.map(o=>o.org_id));
    return MOCK_OBJECTS.filter(o=>permIds.has(o.org_id)||user?.is_superuser);
  },[permitted,user]);
  const filtered=useMemo(()=>allObjs
    .filter(o=>(orgFilter==='all'||o.org_id===parseInt(orgFilter)))
    .filter(o=>(typeFilter==='all'||o.object_type===typeFilter))
    .filter(o=>!search||o.name.toLowerCase().includes(search.toLowerCase())||
                        (o.description||'').toLowerCase().includes(search.toLowerCase()))
  ,[allObjs,orgFilter,typeFilter,search]);
  // Type count cards
  const typeCounts=useMemo(()=>{const m={};allObjs.forEach(o=>{m[o.object_type]=(m[o.object_type]||0)+1;});return m;},[allObjs]);
  return(<div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div className="section-header">
      <h2 className="page-title">AWX Objects</h2>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <input className="search-input" placeholder="Search objects…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <select className="select-input" value={orgFilter} onChange={e=>setOrgFilter(e.target.value)}>
          <option value="all">All Orgs</option>
          {permitted.map(o=><option key={o.org_id} value={o.org_id}>{o.org_name}</option>)}
        </select>
        <select className="select-input" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
          <option value="all">All Types</option>
          {Object.entries(OBJ_TYPE_META).map(([k,v])=><option key={k} value={k}>{v.icon} {v.label}</option>)}
        </select>
        <ExportBtn href="/export/orgs.csv" label="Export CSV"/>
      </div>
    </div>
    {/* Type summary cards */}
    <div className="grid-4">
      {Object.entries(OBJ_TYPE_META).map(([type,meta])=>{
        const count=typeCounts[type]||0;
        if(!count)return null;
        return(<div key={type} className="kpi-card" style={{borderTop:`2px solid ${meta.color}`}}>
          <div className="kpi-label">{meta.label}s</div>
          <div className="kpi-value" style={{color:meta.color,fontSize:22}}>{meta.icon} {count}</div>
          <div className="kpi-sub">{orgFilter==='all'?'across all orgs':'in selected org'}</div>
        </div>);
      })}
    </div>
    {/* Object table */}
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:12,fontSize:12,color:'var(--muted)'}}>
        <span>{filtered.length} objects {search&&`matching "${search}"`}</span>
      </div>
      <div className="table-wrap"><table>
        <thead><tr><th>AWX ID</th><th>Type</th><th>Name</th><th>Organization</th><th>Description</th><th>Last Modified</th></tr></thead>
        <tbody>{filtered.map(o=>(
          <tr key={o.awx_id}>
            <td className="mono" style={{color:'var(--muted)'}}>{o.awx_id}</td>
            <td><ObjBadge type={o.object_type}/></td>
            <td><b>{o.name}</b></td>
            <td style={{cursor:'pointer',color:'var(--accent)',fontSize:12}}
                onClick={()=>{const org=permitted.find(p=>p.org_id===o.org_id);if(org&&onOrgClick)onOrgClick(org);}}>
              {o.org_name}
            </td>
            <td style={{color:'var(--muted)',fontSize:12,maxWidth:300}}>{o.description||'—'}</td>
            <td style={{color:'var(--muted)',fontSize:12}}>{o.modified_at||'—'}</td>
          </tr>
        ))}</tbody>
      </table></div>
    </div>
    {/* Group by type section */}
    {typeFilter==='all'&&!search&&Object.entries(OBJ_TYPE_META).map(([type,meta])=>{
      const items=allObjs.filter(o=>o.object_type===type&&(orgFilter==='all'||o.org_id===parseInt(orgFilter)));
      if(!items.length)return null;
      return(<div key={type} className="card">
        <div className="section-title" style={{marginBottom:12,color:meta.color}}>
          {meta.icon} {meta.label}s <span style={{fontSize:12,color:'var(--muted)',fontWeight:400}}>({items.length})</span>
        </div>
        <div className="table-wrap"><table>
          <thead><tr><th>AWX ID</th><th>Name</th><th>Organization</th><th>Description</th><th>Modified</th></tr></thead>
          <tbody>{items.map(o=>(<tr key={o.awx_id}>
            <td className="mono" style={{color:'var(--muted)'}}>{o.awx_id}</td>
            <td><b>{o.name}</b></td>
            <td style={{color:'var(--muted)',fontSize:12}}>{o.org_name}</td>
            <td style={{color:'var(--muted)',fontSize:12}}>{o.description||'—'}</td>
            <td style={{color:'var(--muted)',fontSize:12}}>{o.modified_at||'—'}</td>
          </tr>))}</tbody>
        </table></div>
      </div>);
    })}
  </div>);
}

// ── Reports & Exports page ────────────────────────────────
function ReportsPage({orgs,user}){
  const[period,setPeriod]=useState('month');
  const permitted=useMemo(()=>getPermittedOrgs(user,orgs),[user,orgs]);
  const GLOBAL_REPORTS=[
    {label:'Organization Summary',desc:'All accessible orgs with 30-day job counts, success rates, and resource counts',href:`/export/summary.csv?period=${period}`},
    {label:'ROI Summary',desc:'Cost avoided, hours saved, and efficiency ratios by template (dynamic method)',href:`/export/roi/summary.csv?period=${period}`},
    {label:'ROI Template Rankings',desc:'Templates ranked by net business value with per-host rate details',href:`/export/roi/templates.csv?period=${period}`},
  ];
  return(<div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div className="section-header">
      <h2 className="page-title">Reports & Exports</h2>
      <PeriodBar value={period} onChange={setPeriod}/>
    </div>
    <div className="info-box">All CSV downloads are scoped to your accessible organizations. Files are generated fresh on each download and reflect the latest AWX sync data.</div>
    {/* Global */}
    <div className="card">
      <div className="section-title" style={{marginBottom:14}}>Global Reports</div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {GLOBAL_REPORTS.map(r=>(<div key={r.label} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)'}}>
          <div><b style={{fontSize:13}}>{r.label}</b><div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{r.desc}</div></div>
          <ExportBtn href={r.href} label="Download CSV" primary/>
        </div>))}
      </div>
    </div>
    {/* Per-org */}
    <div className="card">
      <div className="section-title" style={{marginBottom:14}}>Per-Organization Reports</div>
      <div className="table-wrap"><table>
        <thead><tr><th>Organization</th><th>Access</th><th>Jobs CSV</th><th>RBAC CSV</th><th>Objects CSV</th><th>Trend CSV</th><th>Full Report</th></tr></thead>
        <tbody>{permitted.map(o=>{const lvl=getUserOrgLevel(user,o.org_id);return(<tr key={o.org_id}>
          <td><b>{o.org_name}</b></td>
          <td><RoleBadge level={lvl}/></td>
          <td><ExportBtn href={`/export/org/${o.org_id}/jobs.csv?period=${period}`} label="Jobs"/></td>
          <td><ExportBtn href={`/export/org/${o.org_id}/rbac.csv`} label="RBAC"/></td>
          <td><ExportBtn href={`/export/org/${o.org_id}/objects.csv`} label="Objects"/></td>
          <td><ExportBtn href={`/export/org/${o.org_id}/trend.csv?period=${period}`} label="Trend"/></td>
          <td><ExportBtn href={`/export/report/${o.org_id}.csv?period=${period}`} label="Full Report" primary/></td>
        </tr>);})}</tbody>
      </table></div>
    </div>
    <div style={{fontSize:11,color:'var(--muted2)',textAlign:'center'}}>All CSVs are generated fresh on download — data reflects the latest AWX sync.</div>
  </div>);
}

// ── App shell ─────────────────────────────────────────────
function App(){
  const[page,setPage]=useState('dashboard');const[selectedOrg,setOrg]=useState(null);
  const[user,setUser]=useState(MOCK?MOCK_USER:null);
  const[allOrgs,setAllOrgs]=useState(MOCK?MOCK_ORGS:[]);
  const authEnabled=window.AWX_PORTAL_CONFIG.authEnabled;
  useEffect(()=>{if(!MOCK){if(authEnabled)apiFetch('/auth/me').then(u=>u&&setUser(u)).catch(()=>{});apiFetch('/orgs').then(d=>d&&setAllOrgs(d)).catch(()=>{});};},[]);
  const permitted=useMemo(()=>getPermittedOrgs(user,allOrgs),[user,allOrgs]);
  const isScoped=user&&!user.is_superuser&&user.portal_role!=='admin';
  const showAuth=authEnabled&&!MOCK&&!user;
  const initials=user?.display_name?.split(' ').map(w=>w[0]).join('').slice(0,2)||'??';
  function nav(id){setPage(id);setOrg(null);}
  function goOrg(o){setOrg(o);setPage('org-detail');}
  const NAV=[{id:"dashboard",label:"Dashboard"},{id:"orgs",label:"Organizations"},{id:"objects",label:"AWX Objects"},{id:"jobs",label:"Jobs"},{section:"Analytics",id:"roi",label:"ROI & Impact"},{id:"reports",label:"Reports & Exports"},{section:"System",id:"sync",label:"Sync Status"}];
  return(<div id="root">
    <div className="topbar">
      <div className="logo"><div className="logo-icon">A</div><span style={{color:'var(--text)'}}>AWX<span style={{fontSize:11,color:'var(--muted)',fontWeight:400,marginLeft:2}}> Analytics</span></span></div>
      <span style={{fontSize:12,color:'var(--muted)'}}>{window.AWX_PORTAL_CONFIG.orgName}</span>
      {isScoped&&<span className="scope-badge">Scoped: {permitted.length} org{permitted.length!==1?'s':''}</span>}
      <span className="topbar-spacer"/>
      {MOCK&&<span className="demo-tag">DEMO</span>}
      {user?(<a href="/api/auth/logout" className="user-pill"><div className="user-avatar">{initials}</div><span>{user.display_name||user.username}</span><RoleBadge level={user.portal_role}/></a>):authEnabled?(<a href="/api/auth/login"><button className="login-btn">Sign in with AWX</button></a>):null}
    </div>
    <div className="layout">
      <nav className="sidebar">
        {NAV.map((n,i)=>(<React.Fragment key={i}>
          {n.section&&<div className="nav-section">{n.section}</div>}
          <div className={`nav-item${page===n.id&&!selectedOrg?' active':''}`} onClick={()=>nav(n.id)}>
            <div className="nav-dot"/>{n.label}
          </div>
        </React.Fragment>))}
        {permitted.length>0&&<><div className="nav-section">My Orgs</div>
          {permitted.map(o=>(<div key={o.org_id} className={`nav-org-item${selectedOrg?.org_id===o.org_id?' active':''}`} onClick={()=>goOrg(o)}><span style={{fontSize:9,opacity:.5}}>◆</span>{o.org_name}</div>))}</>}
      </nav>
      <main className="main">
        {showAuth?<div className="auth-wall"><div style={{fontSize:40}}>🔐</div><h2>Sign in required</h2><p>This portal uses AWX OAuth2. Your existing AWX credentials (backed by AD) work here — no separate login.</p><a href="/api/auth/login"><button className="login-btn" style={{fontSize:14,padding:'9px 22px'}}>Sign in with AWX</button></a></div>:<>
          {page==='dashboard'&&!selectedOrg&&<DashboardPage orgs={allOrgs} user={user} onOrgClick={goOrg}/>}
          {page==='org-detail'&&selectedOrg&&<OrgDetailPage org={selectedOrg} user={user} onBack={()=>nav('dashboard')}/>}
          {page==='orgs'&&<OrgsListPage orgs={allOrgs} user={user} onOrgClick={goOrg}/>}
          {page==='objects'&&<ObjectsPage orgs={allOrgs} user={user} onOrgClick={goOrg}/>}
          {page==='jobs'&&<JobsPage orgs={allOrgs} user={user}/>}
          {page==='roi'&&<ROIPage user={user} orgs={allOrgs}/>}
          {page==='reports'&&<ReportsPage orgs={allOrgs} user={user}/>}
          {page==='sync'&&<SyncPage/>}
        </>}
      </main>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
