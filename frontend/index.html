<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AWX Analytics Portal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg:#090c12;--surface:#0f1420;--surface2:#161c2d;--border:#232d45;--border2:#2d3a5a;--accent:#3b82f6;--accent2:#6366f1;--accent3:#06b6d4;--success:#10b981;--danger:#f43f5e;--warning:#f59e0b;--purple:#8b5cf6;--text:#e2e8f0;--muted:#64748b;--muted2:#475569;--r:10px;--rs:6px;--font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(59,130,246,.08),transparent)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#root{display:flex;flex-direction:column;min-height:100vh}

/* Topbar */
.topbar{background:rgba(15,20,32,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 18px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.logo-icon{width:26px;height:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}
.topbar-spacer{flex:1}
.user-pill{display:flex;align-items:center;gap:7px;padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;color:var(--text);text-decoration:none;transition:border-color .15s}
.user-pill:hover{border-color:var(--accent)}
.user-avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff}
.login-btn{padding:5px 13px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;font-size:12px;font-weight:500;font-family:var(--font)}
.demo-tag{background:rgba(245,158,11,.15);color:var(--warning);padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;border:1px solid rgba(245,158,11,.2)}
.scope-badge{background:rgba(59,130,246,.12);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:11px;border:1px solid rgba(59,130,246,.2)}

/* Layout */
.layout{display:flex;flex:1}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);padding:10px 7px;display:flex;flex-direction:column;gap:1px;flex-shrink:0;overflow-y:auto}
.nav-section{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;padding:10px 10px 4px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--muted);transition:all .12s;font-size:13px;user-select:none}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,.12);color:var(--accent);font-weight:500}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0}
.nav-item.active .nav-dot{opacity:1}
.nav-org-item{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 22px;border-radius:6px;cursor:pointer;color:var(--muted2);font-size:12px;transition:all .12s}
.nav-org-item:hover{background:var(--surface2);color:var(--text)}
.nav-org-item.active{color:var(--accent);font-weight:500}
.main{flex:1;padding:22px 24px;overflow-y:auto;min-width:0}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi-card.blue::before{background:var(--accent)}.kpi-card.green::before{background:var(--success)}.kpi-card.red::before{background:var(--danger)}.kpi-card.amber::before{background:var(--warning)}.kpi-card.purple::before{background:var(--purple)}.kpi-card.cyan::before{background:var(--accent3)}
.kpi-label{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.kpi-value{font-size:26px;font-weight:600;line-height:1;letter-spacing:-.5px}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:14px;font-weight:600;letter-spacing:-.2px}
.page-title{font-size:18px;font-weight:600;letter-spacing:-.3px}

/* Period bar */
.period-bar{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:2px}
.period-btn{padding:3px 10px;border-radius:5px;cursor:pointer;font-size:11px;border:none;background:transparent;color:var(--muted);font-family:var(--font);transition:all .12s}
.period-btn.active{background:var(--accent);color:#fff;font-weight:500}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:var(--mono);font-size:12px}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500}
.badge-success{background:rgba(16,185,129,.1);color:var(--success);border:1px solid rgba(16,185,129,.2)}
.badge-danger{background:rgba(244,63,94,.1);color:var(--danger);border:1px solid rgba(244,63,94,.2)}
.badge-warning{background:rgba(245,158,11,.1);color:var(--warning);border:1px solid rgba(245,158,11,.2)}
.badge-info{background:rgba(59,130,246,.1);color:var(--accent);border:1px solid rgba(59,130,246,.2)}
.badge-purple{background:rgba(139,92,246,.1);color:var(--purple);border:1px solid rgba(139,92,246,.2)}
.badge-muted{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.badge-cyan{background:rgba(6,182,212,.1);color:var(--accent3);border:1px solid rgba(6,182,212,.2)}
.cat-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500;text-transform:capitalize}
.obj-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}

/* Progress */
.prog-bar{width:100%;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px}

/* ROI hero */
.roi-hero{background:linear-gradient(135deg,rgba(59,130,246,.07),rgba(99,102,241,.07));border:1px solid rgba(59,130,246,.18);border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:20px;margin-bottom:18px}
.roi-hero-number{font-size:40px;font-weight:600;letter-spacing:-2px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.roi-hero-label{font-size:12px;color:var(--muted);margin-top:2px}

/* Auth wall */
.auth-wall{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:65vh;gap:14px;text-align:center}
.auth-wall h2{font-size:22px;font-weight:600}
.auth-wall p{color:var(--muted);max-width:430px;line-height:1.7;font-size:13px}

/* Export bar */
.export-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.export-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:11px;font-weight:500;color:var(--muted);transition:all .15s;text-decoration:none;font-family:var(--font)}
.export-btn:hover{color:var(--text);border-color:var(--border2);background:var(--surface)}
.export-btn.primary-export{background:rgba(59,130,246,.1);color:var(--accent);border-color:rgba(59,130,246,.25)}
.export-btn.primary-export:hover{background:rgba(59,130,246,.18)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:22px;width:510px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.form-group{margin-bottom:13px}
.form-label{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);padding:7px 11px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border .15s}
.form-input:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-hint{font-size:11px;color:var(--muted);margin-top:3px}
.btn-primary{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:500;font-family:var(--font)}
.btn-ghost{padding:7px 16px;background:transparent;color:var(--muted);border:1px solid var(--border2);border-radius:var(--rs);cursor:pointer;font-size:13px;font-family:var(--font)}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* Utility */
.spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:flex;align-items:center;justify-content:center;min-height:160px}
.error-box{background:rgba(244,63,94,.07);border:1px solid rgba(244,63,94,.2);border-radius:var(--r);padding:14px;color:var(--danger);font-size:13px}
.back-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted);margin-bottom:14px;font-family:var(--font)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:7px 15px;background:none;border:none;cursor:pointer;font-size:13px;font-family:var(--font);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.search-input{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 11px;color:var(--text);font-size:13px;font-family:var(--font);width:190px;outline:none}
.search-input:focus{border-color:var(--accent)}
.select-input{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 11px;color:var(--text);font-size:13px;outline:none;cursor:pointer;font-family:var(--font)}
.role-chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:11px}
.role-admin{background:rgba(244,63,94,.1);color:var(--danger);border:1px solid rgba(244,63,94,.2)}
.role-developer{background:rgba(59,130,246,.1);color:var(--accent);border:1px solid rgba(59,130,246,.2)}
.role-viewer{background:rgba(100,116,139,.1);color:var(--muted);border:1px solid var(--border)}
.custom-tooltip{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 13px;font-size:12px;font-family:var(--font)}
.tt-label{font-weight:500;margin-bottom:5px;color:var(--text)}
.tt-item{display:flex;justify-content:space-between;gap:14px;color:var(--muted);margin-top:2px}

/* Org card */
.org-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s,transform .1s}
.org-card:hover{border-color:var(--accent);transform:translateY(-1px)}

/* Object type pills */
.ot-templates{color:#3b82f6}.ot-inventory{color:#10b981}.ot-project{color:#8b5cf6}.ot-credential{color:#f59e0b}.ot-workflow{color:#06b6d4}

/* Info box */
.info-box{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.15);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.6}

/* Access denied */
.access-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:12px;text-align:center;color:var(--muted)}
.access-denied h3{color:var(--text);font-size:16px}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.AWX_PORTAL_CONFIG={
  useMockData: true,
  apiBase: '/api',
  orgName: 'My Enterprise',
  authEnabled: false,
};
</script>
<script type="text/babel">
const{useState,useEffect,useMemo,useCallback}=React;
const{AreaChart,Area,BarChart,Bar,LineChart,Line,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ResponsiveContainer,PieChart,Pie,Cell}=Recharts;
const API=window.AWX_PORTAL_CONFIG.apiBase,MOCK=window.AWX_PORTAL_CONFIG.useMockData;
const PERIODS=['day','week','month','quarter','year'];
const CAT_COLORS={patching:'#f59e0b',deployment:'#3b82f6',compliance:'#8b5cf6',backup:'#10b981',monitoring:'#06b6d4',security:'#f43f5e',provisioning:'#6366f1',decommission:'#ec4899',general:'#64748b'};
const OBJ_TYPE_META={job_template:{label:'Job Template',color:'#3b82f6',icon:'⚙'},workflow_job_template:{label:'Workflow',color:'#06b6d4',icon:'⛓'},project:{label:'Project',color:'#8b5cf6',icon:'📁'},inventory:{label:'Inventory',color:'#10b981',icon:'🗂'},credential:{label:'Credential',color:'#f59e0b',icon:'🔑'},host:{label:'Host',color:'#64748b',icon:'🖥'}};

// ── Fetch helpers ─────────────────────────────────────────
async function apiFetch(p){const r=await fetch(API+p,{credentials:'include'});if(r.status===401){window.location.href='/api/auth/login';return null;}if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}
function useApi(fn,deps=[]){const[data,setData]=useState(null);const[loading,setLoading]=useState(true);const[error,setError]=useState(null);useEffect(()=>{setLoading(true);setError(null);fn().then(d=>{setData(d);setLoading(false);}).catch(e=>{setError(e.message);setLoading(false);});},deps);return{data,loading,error};}

// ── Mock data ─────────────────────────────────────────────
function genDays(n,base=120,rate=.92){return Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-n+i+1);const t=Math.round(base*(.7+Math.random()*.6));const s=Math.round(t*rate*(.92+Math.random()*.16));return{metric_date:d.toISOString().slice(0,10),total_jobs:t,successful_jobs:s,failed_jobs:Math.max(0,t-s),success_rate_pct:Math.round(s/t*1000)/10,avg_duration_s:Math.round(60+Math.random()*180)};});}
function genRoiDays(n){return Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-n+i+1);const r2=Math.round(80+Math.random()*120);const h=Math.round(r2*.9*(45+Math.random()*60)/60*10)/10;return{metric_date:d.toISOString().slice(0,10),total_runs:r2,hours_saved:h,cost_avoided_usd:Math.round(h*78*100)/100,net_value_usd:Math.round(h*72*100)/100};});}

const MOCK_ORGS_ALL=[
  {org_id:1,org_name:'Platform Engineering',total_jobs_30d:3210,success_jobs_30d:3020,failed_jobs_30d:140,canceled_jobs_30d:50,success_rate_pct:94.1,avg_duration_s:95,template_count:42,inventory_count:8,user_count:18,team_count:4},
  {org_id:2,org_name:'Security Operations',total_jobs_30d:1840,success_jobs_30d:1780,failed_jobs_30d:45,canceled_jobs_30d:15,success_rate_pct:96.7,avg_duration_s:62,template_count:28,inventory_count:5,user_count:11,team_count:3},
  {org_id:3,org_name:'Data & ML',total_jobs_30d:956,success_jobs_30d:891,failed_jobs_30d:55,canceled_jobs_30d:10,success_rate_pct:93.2,avg_duration_s:310,template_count:15,inventory_count:4,user_count:7,team_count:2},
  {org_id:4,org_name:'DevOps Core',total_jobs_30d:2104,success_jobs_30d:1960,failed_jobs_30d:120,canceled_jobs_30d:24,success_rate_pct:93.2,avg_duration_s:78,template_count:36,inventory_count:6,user_count:14,team_count:3},
];
// Admin user sees all orgs; developer/viewer see only their scoped orgs
const MOCK_USER_ADMIN={username:'jsmith',display_name:'John Smith',portal_role:'admin',is_superuser:true,org_permissions:[{org_id:1,portal_level:'admin'},{org_id:2,portal_level:'admin'},{org_id:3,portal_level:'admin'},{org_id:4,portal_level:'admin'}]};
const MOCK_USER_DEV={username:'adev',display_name:'Alice Dev',portal_role:'developer',is_superuser:false,org_permissions:[{org_id:1,portal_level:'developer'},{org_id:2,portal_level:'viewer'}]};
const MOCK_USER=MOCK_USER_ADMIN; // change to MOCK_USER_DEV to test scoped view

const MOCK_OBJECTS=[
  {awx_id:101,object_type:'job_template',name:'Deploy App',description:'Deploy application to K8s',created_at:'2024-01-15',modified_at:'2024-10-22'},
  {awx_id:102,object_type:'job_template',name:'Patch RHEL Servers',description:'Apply OS patches',created_at:'2024-01-15',modified_at:'2024-11-02'},
  {awx_id:103,object_type:'job_template',name:'Run Backup',description:'Backup critical data',created_at:'2024-03-01',modified_at:'2024-10-10'},
  {awx_id:110,object_type:'workflow_job_template',name:'Full Deploy Pipeline',description:'Build + test + deploy',created_at:'2024-05-12',modified_at:'2024-11-15'},
  {awx_id:120,object_type:'project',name:'ansible-playbooks',description:'Main playbook repo',created_at:'2024-01-01',modified_at:'2024-11-20'},
  {awx_id:130,object_type:'inventory',name:'Production Hosts',description:'All prod servers',created_at:'2024-01-01',modified_at:'2024-11-18'},
  {awx_id:131,object_type:'inventory',name:'Staging Hosts',description:'Staging environment',created_at:'2024-02-10',modified_at:'2024-10-05'},
  {awx_id:140,object_type:'credential',name:'SSH Deploy Key',description:'Production SSH key',created_at:'2024-01-08',modified_at:'2024-06-14'},
  {awx_id:141,object_type:'credential',name:'Vault Token',description:'HashiCorp Vault',created_at:'2024-01-08',modified_at:'2024-07-20'},
];
const MOCK_RBAC={
  users:[{id:1,username:'jsmith',first_name:'John',last_name:'Smith',email:'jsmith@co.com',is_superuser:true,roles:['Admin'],portal_level:'admin'},{id:2,username:'amaria',first_name:'Ana',last_name:'Maria',email:'amaria@co.com',is_superuser:false,roles:['Member'],portal_level:'developer'},{id:3,username:'tlee',first_name:'Tom',last_name:'Lee',email:'tlee@co.com',is_superuser:false,roles:['Auditor'],portal_level:'viewer'}],
  teams:[{id:1,name:'Infra Team',description:'Core infrastructure',member_count:6},{id:2,name:'Release Team',description:'CI/CD',member_count:4}],
};

// ── Helpers ───────────────────────────────────────────────
function PeriodBar({value,onChange}){return(<div className="period-bar">{PERIODS.map(p=>(<button key={p} className={`period-btn${value===p?' active':''}`} onClick={()=>onChange(p)}>{p.charAt(0).toUpperCase()+p.slice(1)}</button>))}</div>);}
function StatusBadge({status}){const m={successful:'badge-success',failed:'badge-danger',error:'badge-danger',canceled:'badge-warning',running:'badge-info'};return <span className={`badge ${m[status]||'badge-muted'}`}>{status}</span>;}
function RoleBadge({level}){const m={admin:'role-admin',developer:'role-developer',viewer:'role-viewer'};return <span className={`role-chip ${m[level]||'role-viewer'}`}>{level||'viewer'}</span>;}
function CatBadge({cat}){const c=CAT_COLORS[cat]||'#64748b';return <span className="cat-badge" style={{background:`${c}18`,color:c,border:`1px solid ${c}30`}}>{cat||'—'}</span>;}
function ObjBadge({type}){const m=OBJ_TYPE_META[type]||{label:type,color:'#64748b',icon:'◻'};return <span className="obj-badge" style={{background:`${m.color}14`,color:m.color,border:`1px solid ${m.color}25`}}>{m.icon} {m.label}</span>;}
function KPI({label,value,sub,color,accent}){return(<div className={`kpi-card ${accent||''}`}><div className="kpi-label">{label}</div><div className="kpi-value" style={color?{color}:undefined}>{value??'—'}</div>{sub&&<div className="kpi-sub">{sub}</div>}</div>);}
function Spinner(){return <div className="center"><div className="spinner"/></div>;}
function ErrorBox({msg}){return <div className="error-box">⚠ {msg}</div>;}
function SuccessBar({rate}){const color=rate>=95?'var(--success)':rate>=85?'var(--warning)':'var(--danger)';return(<div style={{display:'flex',alignItems:'center',gap:8}}><div className="prog-bar" style={{flex:1}}><div className="prog-fill" style={{width:`${Math.min(rate,100)}%`,background:color}}/></div><span style={{color,fontWeight:500,fontSize:12,minWidth:38}}>{rate}%</span></div>);}
function fmtDur(s){if(!s)return'—';if(s<60)return`${Math.round(s)}s`;if(s<3600)return`${Math.floor(s/60)}m ${Math.round(s%60)}s`;return`${Math.floor(s/3600)}h ${Math.round((s%3600)/60)}m`;}
function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtMoney(v){if(v==null)return'—';return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);}
function fmtNum(v){return v==null?'—':Number(v).toLocaleString();}
function TT({active,payload,label}){if(!active||!payload?.length)return null;return(<div className="custom-tooltip"><div className="tt-label">{label}</div>{payload.map((p,i)=>(<div key={i} className="tt-item" style={{color:p.color}}><span>{p.name}</span><b style={{color:'var(--text)'}}>{typeof p.value==='number'?p.value.toLocaleString():p.value}</b></div>))}</div>);}

function getUserOrgLevel(user,orgId){if(!user)return'none';if(user.is_superuser||user.portal_role==='admin')return'admin';const p=user.org_permissions?.find(x=>x.org_id===orgId);return p?p.portal_level:'none';}
function getPermittedOrgs(user,allOrgs){if(!user||!allOrgs)return[];if(user.is_superuser||user.portal_role==='admin')return allOrgs;const ids=new Set((user.org_permissions||[]).map(p=>p.org_id));return allOrgs.filter(o=>ids.has(o.org_id));}

// Export button that triggers a CSV download
function ExportBtn({href,label,primary}){
  if(MOCK)return(<button className={`export-btn${primary?' primary-export':''}`} onClick={()=>alert('Export disabled in demo mode.\nIn live mode this downloads: '+href)}>⬇ {label}</button>);
  return <a className={`export-btn${primary?' primary-export':''}`} href={API+href} target="_blank" rel="noreferrer">⬇ {label}</a>;
}

// ── Auth wall ─────────────────────────────────────────────
function AuthWall(){return(<div className="auth-wall"><div style={{fontSize:40}}>🔐</div><h2>Sign in required</h2><p>This portal uses AWX OAuth2 for authentication. Your existing AWX credentials (backed by Active Directory) work here — no separate login.</p><a href="/api/auth/login"><button className="login-btn" style={{fontSize:14,padding:'9px 22px'}}>Sign in with AWX</button></a><p style={{fontSize:11,color:'var(--muted2)'}}>Your AD group membership controls access. Contact your org admin for access issues.</p></div>);}

// ── Access denied (when user tries org they can't see) ────
function AccessDenied({orgName}){return(<div className="access-denied"><div style={{fontSize:32}}>🚫</div><h3>Access restricted</h3><p style={{fontSize:13,maxWidth:360,lineHeight:1.6}}>You don't have access to {orgName||'this organization'}. Your portal access is scoped to your AD group memberships. Contact your org admin to request access.</p></div>);}

// ── Sync page ─────────────────────────────────────────────
function SyncPage(){
  const{data,loading,error}=useApi(()=>MOCK?Promise.resolve([{entity:'jobs',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:8764},{entity:'organizations',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:4},{entity:'users',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:50},{entity:'job_templates',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:121},{entity:'workflow_jobs',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:342},{entity:'projects',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:18},{entity:'inventories',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:23},{entity:'credentials',last_synced_at:new Date().toISOString(),last_status:'ok',records_synced:34}]):apiFetch('/sync'),[]);
  return(<div style={{display:'flex',flexDirection:'column',gap:14}}>
    <h2 className="page-title">Sync Status</h2>
    {loading?<Spinner/>:error?<ErrorBox msg={error}/>:(
      <div className="card"><div className="table-wrap"><table>
        <thead><tr><th>Entity</th><th>Last Synced</th><th>Status</th><th>Records</th></tr></thead>
        <tbody>{(data||[]).map(s=>(<tr key={s.entity}>
          <td className="mono">{s.entity}</td>
          <td style={{color:'var(--muted)',fontSize:12}}>{s.last_synced_at?fmtDate(s.last_synced_at):'Never'}</td>
          <td>{s.last_status==='ok'?<span className="badge badge-success">OK</span>:<span className="badge badge-danger">{s.last_status}</span>}</td>
          <td>{fmtNum(s.records_synced||0)}</td>
        </tr>))}</tbody>
      </table></div></div>
    )}
  </div>);
}

// ── App shell ─────────────────────────────────────────────
function App(){
  const[page,setPage]=useState('dashboard');const[selectedOrg,setOrg]=useState(null);
  const[user,setUser]=useState(MOCK?MOCK_USER:null);
  const authEnabled=window.AWX_PORTAL_CONFIG.authEnabled;
  const[allOrgs,setAllOrgs]=useState(MOCK?MOCK_ORGS_ALL:[]);

  useEffect(()=>{
    if(!MOCK){
      if(authEnabled)apiFetch('/auth/me').then(u=>u&&setUser(u)).catch(()=>{});
      apiFetch('/orgs').then(d=>d&&setAllOrgs(d)).catch(()=>{});
    }
  },[]);

  const permitted=useMemo(()=>getPermittedOrgs(user,allOrgs),[user,allOrgs]);
  const isScoped=user&&!user.is_superuser&&user.portal_role!=='admin';
  const showAuth=authEnabled&&!MOCK&&!user;
  const initials=user?.display_name?.split(' ').map(w=>w[0]).join('').slice(0,2)||'??';

  function nav(id){setPage(id);setOrg(null);}
  function goOrg(o){setOrg(o);setPage('org-detail');}

  const NAV=[
    {id:'dashboard',label:'Dashboard',section:null},
    {id:'orgs',label:'Organizations',section:null},
    {id:'objects',label:'AWX Objects',section:null},
    {id:'jobs',label:'Jobs',section:null},
    {id:'roi',label:'ROI & Impact',section:'Analytics'},
    {id:'reports',label:'Reports & Exports',section:null},
    {id:'sync',label:'Sync Status',section:'System'},
  ];

  return(<div id="root">
    <div className="topbar">
      <div className="logo"><div className="logo-icon">A</div><span style={{color:'var(--text)'}}>AWX<span style={{fontSize:11,color:'var(--muted)',fontWeight:400,marginLeft:2}}> Analytics</span></span></div>
      <span style={{fontSize:12,color:'var(--muted)'}}>{window.AWX_PORTAL_CONFIG.orgName}</span>
      {isScoped&&<span className="scope-badge">Scoped: {permitted.length} org{permitted.length!==1?'s':''}</span>}
      <span className="topbar-spacer"/>
      {MOCK&&<span className="demo-tag">DEMO</span>}
      {user?(<a href="/api/auth/logout" className="user-pill"><div className="user-avatar">{initials}</div><span>{user.display_name||user.username}</span><RoleBadge level={user.portal_role}/></a>):
        authEnabled?(<a href="/api/auth/login"><button className="login-btn">Sign in with AWX</button></a>):null}
    </div>
    <div className="layout">
      <nav className="sidebar">
        {NAV.map((n,i)=>(<React.Fragment key={i}>
          {n.section&&<div className="nav-section">{n.section}</div>}
          <div className={`nav-item${page===n.id&&!selectedOrg?' active':''}`} onClick={()=>nav(n.id)}>
            <div className="nav-dot"/>{n.label}
          </div>
        </React.Fragment>))}
        {permitted.length>0&&<>
          <div className="nav-section">My Orgs</div>
          {permitted.map(o=>(<div key={o.org_id} className={`nav-org-item${selectedOrg?.org_id===o.org_id?' active':''}`} onClick={()=>goOrg(o)}>
            <span style={{fontSize:9,opacity:.5}}>◆</span>{o.org_name}
          </div>))}
        </>}
      </nav>
      <main className="main">
        {showAuth?<AuthWall/>:<>
          {page==='dashboard'&&!selectedOrg&&<DashboardPage orgs={allOrgs} user={user} onOrgClick={goOrg}/>}
          {page==='org-detail'&&selectedOrg&&<OrgDetailPage org={selectedOrg} user={user} onBack={()=>nav('dashboard')}/>}
          {page==='orgs'&&<OrgsListPage orgs={allOrgs} user={user} onOrgClick={goOrg}/>}
          {page==='objects'&&<ObjectsPage orgs={allOrgs} user={user} onOrgClick={goOrg}/>}
          {page==='jobs'&&<JobsPage orgs={allOrgs} user={user}/>}
          {page==='roi'&&<ROIPage user={user} orgs={allOrgs}/>}
          {page==='reports'&&<ReportsPage orgs={allOrgs} user={user}/>}
          {page==='sync'&&<SyncPage/>}
        </>}
      </main>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
