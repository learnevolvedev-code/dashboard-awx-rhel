# ============================================================
# AWX Analytics Portal – Nginx configuration
# Place at: /etc/nginx/conf.d/awx-portal.conf
# ============================================================

upstream awx_portal_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;                          # Replace with FQDN in production

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header Referrer-Policy           "strict-origin"          always;
    add_header Content-Security-Policy
        "default-src 'self' https://unpkg.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
        always;

    # ── API proxy ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://awx_portal_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Disable buffering for SSE/streaming responses
        proxy_buffering    off;
    }

    # ── Static SPA ─────────────────────────────────────────
    location / {
        root  /opt/awx-portal/frontend;
        index index.html;

        # SPA fallback – all unknown paths serve index.html
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Do not cache the SPA entry point
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ── Logging ────────────────────────────────────────────
    access_log /var/log/nginx/awx-portal-access.log;
    error_log  /var/log/nginx/awx-portal-error.log warn;

    # ── Gzip ───────────────────────────────────────────────
    gzip            on;
    gzip_types      application/json text/plain application/javascript text/css;
    gzip_min_length 1024;
    gzip_proxied    any;

    # ── Request limits ─────────────────────────────────────
    client_max_body_size 1m;
}

